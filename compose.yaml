name: integrity-v2-local-demo

services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      INTEGRITY_DB: /data/integrity.db
      V2_AUTH_DB: /data/v2_auth.db
      INTEGRITY_DEMO_XROLE: "0"
      INTEGRITY_ANALYTICS_DEMO: ${INTEGRITY_ANALYTICS_DEMO:-0}
      V2_AUTH_DEV_MAIL: "1"
      V2_AUTH_SECURE_COOKIE: "0"
      V2_SECRET_KEY: ${V2_SECRET_KEY:?Set a random 32+ character V2_SECRET_KEY in .env}
      FRONTEND_ORIGINS: http://127.0.0.1:${DOCKER_DEMO_PORT:-8080}
      TRUSTED_PROXIES: ""
    volumes:
      - demo_data:/data
    networks:
      - demo_net
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DOCKER_DEMO_PORT:-8080}:80"
    networks:
      - demo_net
    security_opt:
      - no-new-privileges:true

networks:
  demo_net:
    driver: bridge

volumes:
  demo_data:
